<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CF Press · Admin</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f6f6f7; color: #17171a; -webkit-font-smoothing: antialiased; }
  a { color: #2563eb; text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { background: #fff; color: #17171a; padding: 0 20px; min-height: 56px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-bottom: 1px solid #e6e6e9; position: sticky; top: 0; z-index: 30; }
  header .brand { font-weight: 650; font-size: 15px; }
  header nav { display: flex; flex-wrap: wrap; align-items: center; }
  header nav a { color: #52525b; margin-right: 4px; padding: 6px 10px; border-radius: 7px; font-size: 13.5px; }
  header nav a:hover { background: #f2f2f3; color: #17171a; text-decoration: none; }
  header nav a.active { color: #17171a; background: #f2f2f3; font-weight: 550; }
  header .spacer { flex: 1; }
  main { max-width: 980px; margin: 26px auto; padding: 0 16px; }
  body.ed-full main { max-width: none; margin: 0; padding: 0; }
  body.ed-full #view-posts { position: fixed; inset: 0; z-index: 40; background: #fff; overflow: auto; padding: 14px 16px; }
  body.ed-full #ed-wysiwyg #ed-body { min-height: calc(100vh - 300px); }
  body.ed-full #ed-md textarea, body.ed-full #ed-md #ed-md-prev { min-height: calc(100vh - 300px); }
  .card { background: #fff; border: 1px solid #e6e6e9; border-radius: 12px; padding: 22px; margin-bottom: 18px; }
  h1 { font-size: 19px; margin: 0 0 14px; letter-spacing: -0.01em; }
  .btn { display: inline-block; border: 1px solid #d4d4d8; background: #fff; color: #17171a; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background .12s ease, border-color .12s ease; }
  .btn:hover { background: #f4f4f5; }
  .btn-primary { background: #17171a; border-color: #17171a; color: #fff; }
  .btn-primary:hover { background: #000; }
  .btn-danger { color: #b42318; border-color: #f0b4b0; background: #fff; }
  .btn-danger:hover { background: #fcf0ef; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden]):not([type=submit]), textarea, select {
    width: 100%; padding: 9px 11px; border: 1px solid #d4d4d8; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; color: #17171a;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
  textarea { min-height: 260px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; line-height: 1.6; }
  label { display: block; margin: 12px 0 5px; font-weight: 550; font-size: 13px; color: #3f3f46; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 220px; }
  .grid table { width: 100%; border-collapse: collapse; }
  .grid th, .grid td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #f0f0f1; font-size: 14px; vertical-align: top; }
  .grid th { font-size: 11.5px; color: #8b8b93; text-transform: uppercase; letter-spacing: 0.04em; }
  .grid tr:hover td { background: #fafafa; }
  .muted { color: #8b8b93; font-size: 12px; }
  .pager { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
  .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; }
  .flash.ok { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  .flash.err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input[type=text] { flex: 1 1 140px; width: auto; max-width: 260px; }
  .toolbar select { flex: 0 0 auto; width: auto; max-width: 160px; }
  #login-card { max-width: 380px; margin: 88px auto; }
  #view { display: none; }
  .hidden { display: none !important; }
  /* 初始化向导 */
  .setup-brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 14px; color: #52525b; margin-bottom: 20px; }
  .setup-brand .logo { display: inline-grid; place-items: center; width: 26px; height: 26px; background: #17171a; color: #fff; border-radius: 6px; font-size: 11px; font-weight: 700; }
  .setup-sub { margin: 0 0 18px; line-height: 1.6; }
  .btn-block { display: block; width: 100%; text-align: center; padding: 11px 14px; font-size: 14px; margin-top: 18px; }
  .setup-msg { margin-top: 12px; font-size: 13px; color: #8b8b93; white-space: pre-wrap; min-height: 1em; }
  .dl-sep { border-top: 1px solid #eee; margin: 22px 0 16px; }
  .dl-h { font-size: 15px; font-weight: 600; color: #111; margin: 0 0 14px; }
  #login-card.setup-mode { max-width: 460px; }
  .setup-mode label { margin: 0 0 14px; }
  .setup-mode label input { display: block; margin-top: 6px; }
  @media (max-width: 720px) {
    header { padding: 8px 12px; }
    header nav a { margin-right: 2px; font-size: 13px; }
    #who { display: none; }
    main { margin: 14px auto; }
  }
</style>
</head>
<body>
<header id="topbar" class="hidden">
  <span class="brand" id="site-name">CF Press</span>
  <nav>
    <a href="#posts" data-nav="posts" class="active">文章</a>
    <a href="#taxonomies" data-nav="tax">分类 / 标签</a>
    <a href="#media" data-nav="media">媒体</a>
    <a href="#users" data-nav="users">用户</a>
    <a href="#templates" data-nav="tpl">模板</a>
    <a href="#documents" data-nav="documents">📚 文档库</a>
    <a href="#settings" data-nav="settings">设置</a>
<a href="#comments" data-nav="comments">💬 评论</a>
  </nav>
  <span class="spacer"></span>
  <a href="/" target="_blank" class="btn btn-sm" style="color:#52525b;">查看站点 ↗</a>
  <button class="btn btn-sm" id="btn-account" title="我的账号"><span id="who"></span></button>
  <button class="btn btn-sm" id="btn-logout">退出</button>
</header>

<main>
  <div id="login-card" class="card hidden">
    <h1>登录</h1>
    <div id="flash-login"></div>
    <form id="login-form">
      <label>用户名</label>
      <input type="text" id="login-user" autocomplete="username" required>
      <label>密码</label>
      <input type="password" id="login-pass" autocomplete="current-password" required>
      <div style="margin-top:16px;">
        <button type="submit" class="btn btn-primary">登 录</button>
      </div>
    </form>
  </div>

  <div id="view">
    <div id="flash-main"></div>
    <section id="view-posts"></section>
    <section id="view-tax" class="hidden"></section>
    <section id="view-media" class="hidden"></section>
    <section id="view-users" class="hidden"></section>
    <section id="view-tpl" class="hidden"></section>
    <section id="view-documents" class="hidden"></section>
    <section id="view-settings" class="hidden"></section>
<section id="view-comments" class="hidden"></section>
  </div>
</main>

<div id="cats-mask" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:60;"></div>
<div id="cats-panel" class="hidden" style="position:fixed;z-index:61;top:50%;left:50%;transform:translate(-50%,-50%);width:min(460px,92vw);max-height:80vh;overflow:auto;background:#fff;border:1px solid #e6e6e9;border-radius:14px;padding:22px;">
  <h2 class="dl-h">设置分类</h2>
  <p class="muted" id="cats-sub" style="margin:0 0 12px;"></p>
  <div id="cats-list" style="display:flex;flex-direction:column;"></div>
  <div style="margin-top:14px;display:flex;gap:8px;align-items:center;">
    <button class="btn btn-primary" id="cats-ok">应用</button>
    <button class="btn" id="cats-cancel">取消</button>
    <span class="muted" id="cats-note"></span>
  </div>
</div>

<div id="acct-mask" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:60;"></div>
<div id="acct-panel" class="hidden" style="position:fixed;z-index:61;top:50%;left:50%;transform:translate(-50%,-50%);width:min(440px,92vw);max-height:88vh;overflow:auto;background:#fff;border:1px solid #e6e6e9;border-radius:14px;padding:22px;">
  <h2 class="dl-h">我的账号</h2>
  <p class="muted" id="acct-who" style="margin:0 0 12px;"></p>
  <div class="row">
    <div><label>昵称</label><input type="text" id="acct-disp"></div>
    <div><label>邮箱</label><input type="email" id="acct-email"></div>
  </div>
  <div style="margin-top:14px;"><button class="btn btn-primary" id="acct-save">保存资料</button></div>
  <div style="margin-top:18px;padding-top:16px;border-top:1px solid #eee;">
    <h2 class="dl-h">改密码</h2>
    <p class="muted" style="margin:0 0 10px;">需要先验明当前密码。改的是<b>网页登录密码</b>；第三方编辑器用的「应用密码」不受影响。</p>
    <div class="row">
      <div><label>当前密码</label><input type="password" id="acct-old" autocomplete="current-password"></div>
      <div><label>新密码</label><input type="password" id="acct-new" placeholder="至少 8 位" autocomplete="new-password"></div>
    </div>
    <div style="margin-top:10px;"><button class="btn btn-primary" id="acct-pass-save">更新密码</button></div>
  </div>
  <div style="margin-top:16px;display:flex;gap:8px;align-items:center;">
    <button class="btn" id="acct-close">关闭</button>
    <span class="muted" id="acct-note"></span>
  </div>
</div>

<script src="/admin/vendor/marked.min.js"></script>
<script src="/admin/app.js?v=20261028e"></script>
</body>
</html>
