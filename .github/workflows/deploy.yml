name: Deploy CF Press

# 一键部署（推荐）：GitHub → Actions → 本工作流 → Run workflow
# 需要先在仓库 Settings → Secrets and variables → Actions 里配置：
#   CLOUDFLARE_API_TOKEN   （Cloudflare API Token，权限：Workers Scripts:Edit、D1:Edit、KV:Edit、R2:Edit）
#   CLOUDFLARE_ACCOUNT_ID  （Cloudflare 账号 ID）
#   AUTH_KEY_SECRET        （可选：插件/同步用的 X-Auth-Key）
on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: "Worker / 资源名（D1、KV、R2 会以此命名）"
        required: true
        default: "cfpress"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Provision D1 / KV / R2 + generate wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/setup.mjs --yes --name="${{ inputs.worker_name }}"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set AUTH_KEY_SECRET (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_KEY_SECRET: ${{ secrets.AUTH_KEY_SECRET }}
        run: |
          if [ -n "$AUTH_KEY_SECRET" ]; then
            printf '%s' "$AUTH_KEY_SECRET" | npx wrangler secret put AUTH_KEY_SECRET
          else
            echo "AUTH_KEY_SECRET not set — skipping."
          fi

      - name: Done
        run: |
          echo "Deployed. Next: open https://<your-worker>.<account>.workers.dev/admin/ to create the admin and set site name/URL."
          echo "To bind a custom domain: Cloudflare Dashboard → Workers & Pages → your Worker → Settings → Domains & Routes."
